<style>

.logo{font-weight:800;text-decoration:none;display:flex;align-items:center;gap:10px}

section{padding:84px 0 0}
.kicker{color:var(--acc);font-weight:700;font-size:.95rem;margin:0 0 6px}
h3.t{font-size:clamp(1.9rem,4.5vw,2.7rem);letter-spacing:-.025em;margin:0 0 36px;line-height:1.1}

.about{display:grid;grid-template-columns:1.3fr 1fr;gap:40px}

.pills{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}

button.btn{font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}.hint{margin:0 0 10px;color:var(--acc);font-weight:700;font-size:.95rem}

   +(C.email?row('✉️','Email',C.email,'mailto:'+C.email):'')+(C.phone?row('📞','Phone',C.phone,'tel:'+tel(C.phone)):'')
   +(C.telegram?row('✈️','Telegram',C.telegram.replace(/^https?:\/\//,''),C.telegram):'')+(C.linkedin?row('💼','LinkedIn',C.linkedin.replace(/^https?:\/\/(www\.)?/,''),C.linkedin):'')
   +(C.location?row('📍','Location',C.location):'')+(C.company?row('🏢','Company',C.company):'')
   +(C.cv?'<button class="btn p" type="button" data-cvm>Download my CV</button>':'')+'</div>';
  function close(){document.removeEventListener('keydown',key);o.remove();document.body.style.overflow='';if(prev&&prev.focus)prev.focus()}
  function key(ev){if(ev.key==='Escape')close()}
  o.addEventListener('click',function(ev){if(ev.target===o)close()});
  q('.mx',o).addEventListener('click',close);
  var cb=q('[data-cvm]',o);if(cb)cb.addEventListener('click',function(){dlCV(cb)});
  document.addEventListener('keydown',key);document.body.appendChild(o);document.body.style.overflow='hidden';q('.mx',o).focus();
}
function render(){
  qa('[data-f]').forEach(function(el){el.textContent=C[el.dataset.f]||''});
  var ini=(C.name||'').split(/\s+/).map(function(w){return w[0]||''}).join('').slice(0,2).toUpperCase();
  qa('[data-i]').forEach(function(el){if(C.photo){el.textContent='';var im=document.createElement('img');im.src=C.photo;im.alt='';el.appendChild(im)}else{el.textContent=ini}});
  
  var ph=q('#photo');if(C.photo){ph.src=C.photo;ph.alt='Portrait of '+C.name}else{q('#avatar').textContent=ini;q('#avatar').style.cssText+=';display:grid;place-items:center;font-size:3rem;font-weight:800;color:#fff'}
  qa('[data-cv]').forEach(function(b){b.hidden=!C.cv;b.onclick=function(){dlCV(b)}});
  qa('[data-hire]').forEach(function(a){a.onclick=function(ev){ev.preventDefault();openHire()}});
  qa('[data-mail]').forEach(function(a){a.href='mailto:'+C.email});
  qa('[data-tel]').forEach(function(a){a.href='tel:'+tel(C.phone)});
  qa('[data-tg]').forEach(function(a){a.href=C.telegram});
  qa('[data-li]').forEach(function(a){a.href=C.linkedin});
  q('#stats').innerHTML=C.stats.map(function(s){var m=/^(\d+)(\D*)$/.exec(s.n);return '<div class="stat"><b'+(m?' data-n="'+m[1]+'" data-s="'+esc(m[2])+'">0':'>'+esc(s.n))+'</b><span>'+esc(s.l)+'</span></div>'}).join('');
  q('#aboutP').innerHTML=C.about.map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
  var all=[];C.skills.forEach(function(g){all=all.concat(g.items)});
  q('#pills').innerHTML=all.slice(0,12).map(function(x){return '<span class="pill">'+esc(x)+'</span>'}).join('');
  var mw=all.slice(0,12),mh=mw.concat(mw).map(function(x){return '<span>'+esc(x)+'</span>'}).join('');
  q('#track').innerHTML=mh;
  q('#tabs').innerHTML=C.exp.map(function(t,i){return '<button role="tab" id="t'+i+'" aria-selected="'+(i===0)+'" aria-controls="p'+i+'">'+esc(t.tab)+'<span class="tn">'+t.items.length+' responsibilities · tap to view</span></button>'}).join('');
  if(!q('.hint'))q('#tabs').insertAdjacentHTML('beforebegin','<p class="hint">👇 Tap a role below to see what I do in each one</p>');
  q('#panels').innerHTML=C.exp.map(function(t,i){return '<div class="panel" id="p'+i+'" role="tabpanel" aria-labelledby="t'+i+'"'+(i?' hidden':'')+'><ul>'+t.items.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'}).join('');
  q('#sk').innerHTML=C.skills.map(function(g){return '<div class="sc"><h4><i>'+esc(g.i)+'</i>'+esc(g.t)+'</h4><div class="pills">'+g.items.map(function(x){return '<span class="pill">'+esc(x)+'</span>'}).join('')+'</div></div>'}).join('');
  q('#edu').innerHTML=C.edu.map(function(e){return '<div class="ec"><b>'+esc(e.t)+'</b><span>'+esc(e.m)+'</span></div>'}).join('');
}
function effects(){
  var tEl=q('#type'),ri=0,rj=0,del=false;
  function tick(){var R=C.roles&&C.roles.length?C.roles:[C.role||''],w=R[ri%R.length];tEl.textContent=w.slice(0,rj);
    if(!del&&rj>=w.length){del=true;return setTimeout(tick,1500)}
    if(del&&rj<=0){del=false;ri++}rj+=del?-1:1;setTimeout(tick,del?40:80)}
  if(reduce){tEl.textContent=(C.roles&&C.roles[0])||C.role||''}else{tick()}
  var tabs=qa('[role=tab]');
  tabs.forEach(function(t){t.addEventListener('click',function(){q('#tabs').classList.add('seen');tabs.forEach(function(o){var on=o===t;o.setAttribute('aria-selected',on);document.getElementById(o.getAttribute('aria-controls')).hidden=!on})})});
  function count(b){var n=+b.dataset.n,s=b.dataset.s||'';if(reduce){b.textContent=n+s;return}var t0=null;
    (function f(ts){t0=t0||ts;var p=Math.min((ts-t0)/1400,1);b.textContent=Math.round(n*(1-Math.pow(1-p,3)))+(p===1?s:'');if(p<1)requestAnimationFrame(f)})(performance.now())}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('show');qa('[data-n]',e.target).forEach(count);io.unobserve(e.target)}})},{threshold:.15});
  qa('.rv').forEach(function(n){io.observe(n)});
  var links=q('#links'),anchors=qa('a',links);
  var spy=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)anchors.forEach(function(a){var on=a.getAttribute('href')==='#'+en.target.id;a.classList.toggle('on',on);if(on&&links.scrollWidth>links.clientWidth)links.scrollTo({left:a.offsetLeft-links.clientWidth/2+a.offsetWidth/2,behavior:'smooth'})})})},{rootMargin:'-45% 0px -50% 0px'});
  ['top','about','experience','skills','education','contact'].forEach(function(id){var n=document.getElementById(id);if(n)spy.observe(n)});
  var r=document.documentElement;
  q('#theme').addEventListener('click',function(){var d=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.setAttribute('data-theme',d?'light':'dark')});
}

/* ---------- dashboard ---------- */
var FIELDS=[['name','Name'],['role','Job title'],['badge','Status badge','Shown at the top, e.g. Open to new opportunities'],['lead','Intro under your name','','a'],['location','Location'],['company','Company'],['email','Email'],['phone','Phone'],['telegram','Telegram link'],['linkedin','LinkedIn link'],['jobTitle','Experience: job title'],['jobMeta','Experience: company and dates'],['ctaTitle','Contact heading'],['ctaText','Contact text']];
function fl(id,label,val,area,hint,wide){return '<label class="fl'+(wide?' w':'')+'"><span>'+label+(hint?'<small>'+hint+'</small>':'')+'</span>'+(area?'<textarea id="'+id+'" rows="'+area+'">'+esc(val)+'</textarea>':'<input id="'+id+'" value="'+esc(val)+'">')+'</label>'}
function f(k){var x=FIELDS.filter(function(a){return a[0]===k})[0];return fl('d-'+k,x[1],C[k],x[3]?3:0,x[2])}
function eg(t){return '<div class="eg"><div class="row"><input class="et" value="'+esc(t.tab)+'" aria-label="Role tab name"><button type="button" class="dbtn x" data-rm>Remove</button></div><textarea class="ei" rows="6" aria-label="Bullet points, one per line">'+esc(t.items.join('\n'))+'</textarea></div>'}
function buildDash(){
  if(!owner)return;
  var d=document.createElement('div');d.id='dash';d.hidden=true;document.body.appendChild(d);
  d.innerHTML='<div class="wrap"><div class="dtop"><div><h1>Edit your portfolio</h1><p>Change anything below, then press Save. Your live site updates for everyone.</p></div><div class="row"><a class="dbtn" href="#top">View site</a><button class="dbtn p" id="save" type="button">Save changes</button></div></div><p class="dstat" id="stat" role="status"></p>'
  +'<div class="dsec"><h2>Profile</h2><p>Your name, headline and photo.</p><div class="dg">'+f('name')+f('role')+f('badge')+'<div class="fl"><span>Photo</span><img class="pprev" id="pprev" alt="Current photo" src="'+esc(C.photo||'')+'"><input type="file" id="pf" accept="image/*"></div>'+'<div class="fl"><span>CV file (PDF)<small id="cvn">'+esc(C.cv?(C.cvName||'CV.pdf')+' attached':'No CV attached')+'</small></span><input type="file" id="cvf" accept="application/pdf"></div>'+'<div class="w" style="grid-column:1/-1">'+f('lead')+'</div></div></div>'
  +'<div class="dsec"><h2>Contact</h2><p>Used in the top card, buttons and footer.</p><div class="dg">'+f('location')+f('company')+f('email')+f('phone')+f('telegram')+f('linkedin')+f('ctaTitle')+f('ctaText')+'</div></div>'
  +'<div class="dsec"><h2>About</h2><p>One paragraph per line.</p><div class="dg">'+fl('d-about','About text',C.about.join('\n'),6,'',1)+fl('d-roles','Typing words under your name',C.roles.join('\n'),4,'One per line')+fl('d-stats','Number cards',C.stats.map(function(s){return s.n+' | '+s.l}).join('\n'),4,'One per line: number | label')+'</div></div>'
  +'<div class="dsec"><h2>Experience</h2><p>Each tab is one role, with one bullet per line.</p><div class="dg">'+f('jobTitle')+f('jobMeta')+'</div><div id="egs" style="margin-top:14px">'+C.exp.map(eg).join('')+'</div><button type="button" class="dbtn" id="addExp">Add role tab</button></div>'
  +'<div class="dsec"><h2>Skills</h2><div class="dg">'+fl('d-skills','Skill groups',C.skills.map(function(g){return g.i+' | '+g.t+' | '+g.items.join(', ')}).join('\n'),7,'One group per line: emoji | title | skill, skill, skill',1)+'</div></div>'
  +'<div class="dsec"><h2>Education &amp; training</h2><div class="dg">'+fl('d-edu','Entries',C.edu.map(function(e){return e.t+' | '+e.m}).join('\n'),6,'One per line: title | details',1)+'</div></div></div>';
  q('#addExp').addEventListener('click',function(){q('#egs').insertAdjacentHTML('beforeend',eg({tab:'New role',items:[]}))});
  d.addEventListener('click',function(ev){var b=ev.target.closest('[data-rm]');if(b)b.closest('.eg').remove()});
  q('#save').addEventListener('click',save);
  q('#pf').addEventListener('change',function(){var fi=this.files[0];if(!fi)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=400;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/4,s,s,0,0,400,400);photoData=c.toDataURL('image/jpeg',.82);q('#pprev').src=photoData};im.src=rd.result};rd.readAsDataURL(fi)});
  q('#cvf').addEventListener('change',function(){var fi=this.files[0];if(!fi)return;if(fi.size>4000000){stat('That PDF is over 4 MB. Choose a smaller file.');return}var rd=new FileReader();rd.onload=function(){cvData=String(rd.result).split(',')[1];cvName=fi.name;q('#cvn').textContent=fi.name+' (will be saved)'};rd.readAsDataURL(fi)});
  built=true;
}
function collect(){
  var N=JSON.parse(JSON.stringify(C));
  FIELDS.forEach(function(a){N[a[0]]=q('#d-'+a[0]).value.trim()});
  N.about=ls(q('#d-about').value);N.roles=ls(q('#d-roles').value);
  N.stats=ls(q('#d-stats').value).map(function(l){var p=pp(l);return{n:p[0],l:p[1]||''}});
  N.skills=ls(q('#d-skills').value).map(function(l){var p=pp(l);return{i:p[0],t:p[1]||'',items:(p[2]||'').split(',').map(function(x){return x.trim()}).filter(Boolean)}});
  N.edu=ls(q('#d-edu').value).map(function(l){var p=pp(l);return{t:p[0],m:p[1]||''}});
  N.exp=qa('.eg').map(function(g){return{tab:q('.et',g).value.trim(),items:ls(q('.ei',g).value)}}).filter(function(x){return x.tab});
  if(photoData)N.photo=photoData;
  if(cvData){N.cv=cvData;N.cvName=cvName}
  return N;
}
function stat(m){q('#stat').textContent=m}
function save(){
  var N=collect(),btn=q('#save');
  var html=SRC.replace(/(<script type="application\/json" id="content">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+JSON.stringify(N).replace(/</g,'\\u003c')+b});
  if(!(window.claude&&claude.use)){stat('Saving works only when the page is open on claude.ai.');return}
  btn.disabled=true;stat('Saving…');
  claude.use('user').then(function(u){
    if(!(u&&u.isOwner&&u.isOwner()))throw{message:'Only the owner of this page can save changes.'};
    return claude.use('artifact');
  }).then(function(art){
    if(!art)throw{message:'Saving is not available here.'};
    return art.publish(html);
  }).then(function(){stat('Saved. Reloading your site…')}).catch(function(e){
    btn.disabled=false;stat(e&&e.code==='conflict'?'The site changed in another tab. Reload and try again.':'Could not save: '+((e&&(e.message||e.code))||'unknown error'));
  });
}
function route(){
  var dash=owner&&location.hash==='#dashboard';
  if(dash&&!built)buildDash();
  q('#site').hidden=dash;
  var d=q('#dash');if(d)d.hidden=!dash;
  if(dash)window.scrollTo(0,0);
}
render();effects();
window.addEventListener('hashchange',route);
if(window.claude&&claude.use){claude.use('user').then(function(u){if(u&&u.isOwner&&u.isOwner()){owner=true;var a=document.createElement('a');a.className='edit-link';a.href='#dashboard';a.textContent='Edit site';q('footer').appendChild(a);route()}}).catch(function(){})}
})();

</script></body></html>
